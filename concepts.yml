context: telephony
name: Telephony
intro: >-
  The common telephony vocabulary -- calls and the recordings and transcriptions they leave,
  the voicemails people miss and the conferences that join many callers -- distilled from the
  APIs that already exist. Phone numbers belong to the messaging context, which owns them for
  voice and SMS alike.
tags: [Telephony, VoIP, Cloud Telephony, IVR, SIP, Calling, Voice, Business Phone]

envelope: [_links, _pagination, _results, data, success, errors, warnings, count, total, page, meta, links,
           value, results, next, previous, has_more, message, status_code, ids, next_page, previous_page,
           page_info, cursor, total_count, per_page, total_pages, current_page, object, url, uri]

common_fields:
  id: [uuid, guid, object_id, record_id, sid, call_id, call_sid, uuid_call]
  created_at: [created, created_date, date_created, create_time, creation_date, created_on, start_time, started_at]
  updated_at: [updated, updated_date, modified_at, last_modified, date_modified, update_time, modified_date, modified, date_updated]
  metadata: [meta_data, custom_fields, custom, attributes, properties, tags]
  status: [state, call_status, disposition]
  duration: [duration_seconds, duration_ms, call_duration, length, billable_seconds, talk_time]
  call_id: [call, call_sid, call_uuid, parent_call_sid]

concepts:
  call:
    segments: [calls, call, phone_calls, phone-calls, call_logs, call-logs, calllogs, call_records, cdrs, call_detail_records]
    aliases:
      from: [from_number, caller, caller_id, caller_number, source, from_formatted, ani]
      to: [to_number, callee, called_number, destination, to_formatted, dnis]
      direction: [call_direction, inbound, type, call_type]
      answered_at: [answer_time, answered, connected_at]
      ended_at: [end_time, ended, hangup_time, completed_at]
      recording_url: [recording, recordings, recording_link]
      agent_id: [agent, user_id, user, owner_id, extension]
      cost: [price, charge, rate]
  recording:
    requires: [call]
    segments: [recordings, recording, call_recordings, call-recordings]
    aliases:
      url: [media_url, recording_url, download_url, uri, file_url, link]
      format: [file_format, mime_type, content_type, media_format]
  transcription:
    requires: [call]
    segments: [transcriptions, transcription, transcripts, transcript]
    aliases:
      text: [transcript, transcription_text, content, body, utterances]
      language: [language_code, locale]
      confidence: [score, confidence_score]
  # voicemail was measured and dropped: 5 providers, whose only shared field was `enabled` --
  # voicemail settings, not voicemail messages.
  conference:
    requires: [call]
    segments: [conferences, conference, conference_calls, bridges, meetings@voice|calls]
    aliases:
      participants: [members, legs, attendees, participant_count]
      ended_at: [end_time, ended, completed_at]

exclude:
  conference:
    syllable: /conversation-config/bridges are AI-agent conversation settings
duplicates:
  quo: [openphone]
  wisprflow-ai: [wispr-ai]

findings:
  - "A call agrees on status, direction, the caller and created_at across CPaaS platforms,
    business phone systems and voice-AI agents -- the call-detail record is shared."
  - "A recording agrees on id, duration, status and created_at; a conference on id, name,
    status and created_at."
  - "Transcriptions span call transcripts and general speech-to-text jobs: they agree only on id,
    status and created_at, because the transcript itself is text, utterances or segments."
decisions:
  - "Phone numbers are the messaging context's: one number serves voice and SMS, and the
    concept is not duplicated."
  - "A call covers call logs, call records and CDRs."
  - "Voice is in the cohort, so voice-AI agents' calls count; every concept but the call
    `requires: [call]`."
  - "Voicemail was measured and dropped: the resources found were settings."
  - "Duplicates merged: OpenPhone into Quo, Wispr."
