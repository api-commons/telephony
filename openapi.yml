openapi: 3.1.0
info:
  title: Telephony (API Commons)
  version: 0.1.0-draft.20261110
  description: 'The common Telephony interface, distilled from the harvested OpenAPI of 146 providers in the APIs.io
    catalog. Not a product: no one serves this API. It is the shape the market already shares, measured, so that
    providers, agents and integrators can map to one vocabulary. See profile.yml.'
  license:
    name: CC BY-NC-SA 4.0
    url: https://creativecommons.org/licenses/by-nc-sa/4.0/
paths:
  /calls:
    get:
      operationId: listCalls
      summary: List calls
      tags:
      - Calls
      x-commons-tier: core
      x-commons-share: 0.857
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: &id001
                  $ref: '#/components/schemas/Call'
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
      - name: cursor
        in: query
        schema:
          type: string
    post:
      operationId: createCall
      summary: Create a call
      tags:
      - Calls
      x-commons-tier: core
      x-commons-share: 0.755
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema: *id001
  /calls/{call_id}:
    parameters:
    - $ref: '#/components/parameters/call_id'
